                                <span class="text-gray-700 text-lg">Frecuencia explicada por <strong>Selección Balanceadora</strong> (Protección vs Malaria).</span>
                            </li>
                            <li class="flex items-center bg-white p-5 rounded-xl shadow-sm border-l-4 border-red-500 hover:shadow-md transition">
                                <div class="bg-red-100 p-3 rounded-full mr-5 text-red-600">
                                    <i data-lucide="globe" class="w-6 h-6"></i>
                                </div>
                                <span class="text-gray-700 text-lg">Hoy representa una <strong>Discordancia Evolutiva</strong> en zonas sin malaria.</span>
                            </li>
                            <li class="flex items-center bg-white p-5 rounded-xl shadow-sm border-l-4 border-purple-500 hover:shadow-md transition">
                                <div class="bg-purple-100 p-3 rounded-full mr-5 text-purple-600">
                                    <i data-lucide="book-open" class="w-6 h-6"></i>
                                </div>
                                <span class="text-gray-700 text-lg">La <strong>Medicina Evolutiva</strong> es clave para el manejo clínico moderno.</span>
                            </li>
                        </ul>
                    </div>
                `
            },
            {
                id: 10,
                title: "¿Preguntas?",
                subtitle: "Muchas gracias por su atención",
                icon: "message-circle",
                bgClass: "bg-white",
                titleColor: "text-blue-900",
                footer: "",
                content: `
                    <div class="h-full flex flex-col items-center justify-center space-y-4">
                        <div class="animate-bounce">
                            <i data-lucide="message-circle" class="w-16 h-16 text-blue-500"></i>
                        </div>
                        <div class="bg-blue-50 p-6 rounded-2xl border border-blue-200 max-w-3xl w-full shadow-lg overflow-y-auto max-h-[60vh]">
                            <h4 class="text-center font-bold text-gray-700 mb-4 border-b border-blue-200 pb-2 text-lg">Anticipación de Preguntas</h4>
                            <ul class="space-y-3 text-gray-700 text-sm md:text-base">
                                <li class="bg-white p-3 rounded-lg shadow-sm">
                                    <strong class="text-blue-800 block mb-1">❓ ¿Por qué es tan grave la Talasemia Mayor?</strong>
                                    R: Toxicidad por cadenas de <strong>Hemoglobina</strong> no apareadas, lo que causa destrucción celular (hemólisis).
                                </li>
                                <li class="bg-white p-3 rounded-lg shadow-sm">
                                    <strong class="text-blue-800 block mb-1">❓ ¿Relación con Anemia Falciforme?</strong>
                                    R: Son "adaptaciones paralelas". Ambas usan la Selección Balanceadora para proteger contra la misma amenaza: la Malaria.
                                </li>
                                <li class="bg-white p-3 rounded-lg shadow-sm">
                                    <strong class="text-blue-800 block mb-1">❓ ¿Tratamiento actual?</strong>
                                    R: Transfusiones crónicas, quelación (eliminar hierro) y trasplante de médula ósea (cura).
                                </li>
                            </ul>
                        </div>
                    </div>
                `
            }
        ];

        // --- ESTADO DE LA APLICACIÓN ---
        let currentSlideIndex = 0;
        const totalSlides = slides.length;

        // --- REFERENCIAS AL DOM ---
        const dom = {
            container: document.getElementById('slide-container'),
            title: document.getElementById('slide-title'),
            subtitle: document.getElementById('slide-subtitle'),
            iconContainer: document.getElementById('slide-icon-container'),
            content: document.getElementById('slide-content'),
            slideNumber: document.getElementById('slide-number'),
            totalSlides: document.getElementById('total-slides'),
            footer: document.getElementById('slide-footer'),
            progressBar: document.getElementById('progress-bar'),
            
            // Controles
            btnNext: document.getElementById('btn-next'),
            btnPrev: document.getElementById('btn-prev'),
            btnFull: document.getElementById('btn-fullscreen'),
            ctrlCurrent: document.getElementById('ctrl-current'),
            ctrlTotal: document.getElementById('ctrl-total')
        };

        // --- INICIALIZACIÓN ---
        dom.totalSlides.textContent = totalSlides;
        dom.ctrlTotal.textContent = totalSlides;
        renderSlide(0);

        // --- FUNCIONES ---
        function renderSlide(index) {
            const slide = slides[index];
            
            // Actualizar Clases del Contenedor (Fondo)
            dom.container.className = `relative w-full max-w-6xl aspect-video ${slide.bgClass} shadow-2xl rounded-xl overflow-hidden flex flex-col transition-all duration-500`;

            // Actualizar Textos
            dom.title.textContent = slide.title;
            dom.title.className = `text-2xl md:text-3xl font-bold transition-colors duration-300 ${slide.titleColor}`;
            
            dom.subtitle.textContent = slide.subtitle || "";
            dom.slideNumber.textContent = index + 1;
            dom.ctrlCurrent.textContent = index + 1;
            dom.footer.textContent = slide.footer;

            // Actualizar Icono del Título
            if (slide.icon) {
                dom.iconContainer.classList.remove('hidden');
                dom.iconContainer.innerHTML = `<i data-lucide="${slide.icon}"></i>`;
            } else {
                dom.iconContainer.classList.add('hidden');
                dom.iconContainer.innerHTML = '';
            }

            // Actualizar Contenido HTML
            // Pequeño truco para reiniciar la animación fade-in
            dom.content.classList.remove('fade-in');
            void dom.content.offsetWidth; // trigger reflow
            dom.content.classList.add('fade-in');
            dom.content.innerHTML = slide.content;

            // Barra de Progreso
            const progress = ((index + 1) / totalSlides) * 100;
            dom.progressBar.style.width = `${progress}%`;

            // Estado de Botones
            dom.btnPrev.disabled = index === 0;
            dom.btnNext.disabled = index === totalSlides - 1;
            dom.btnPrev.style.opacity = index === 0 ? "0.5" : "1";
            dom.btnNext.style.opacity = index === totalSlides - 1 ? "0.5" : "1";

            // RE-RENDERIZAR ICONOS
            lucide.createIcons();
        }

        function nextSlide() {
            if (currentSlideIndex < totalSlides - 1) {
                currentSlideIndex++;
                renderSlide(currentSlideIndex);
            }
        }

        function prevSlide() {
            if (currentSlideIndex > 0) {
                currentSlideIndex--;
                renderSlide(currentSlideIndex);
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // --- EVENT LISTENERS ---
        dom.btnNext.addEventListener('click', nextSlide);
        dom.btnPrev.addEventListener('click', prevSlide);
        dom.btnFull.addEventListener('click', toggleFullscreen);

        // Teclado
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });

    </script>
</body>
